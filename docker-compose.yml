services:
  pihole:
    image: pihole/pihole:2026.07.2
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      # Pi-hole v6: Passwort-Env-Name gegen docs.pi-hole.net/docker/configuration verifiziert
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_upstreams: "9.9.9.9;1.1.1.1"
      # Ohne dies default Pi-hole v6 auf dns.listeningMode=LOCAL: es vertraut dann nur
      # Anfragen aus dem eigenen Docker-Bridge-Subnetz und verwirft echte LAN-Clients
      # stillschweigend als "non-local" (sichtbar im Log als "ignoring query from
      # non-local network ..."). "ALL" ist hier sicher, weil Port 53 laut [M3]/[N4]
      # ohnehin nur an ${PI_STATIC_IP} gebunden ist, nicht an 0.0.0.0.
      FTLCONF_dns_listeningMode: "ALL"
    ports:
      - "${PI_STATIC_IP}:${PORT_DNS}:53/tcp"
      - "${PI_STATIC_IP}:${PORT_DNS}:53/udp"
      - "${PI_STATIC_IP}:${PORT_PIHOLE_UI}:80/tcp"
    volumes:
      - ./data/pihole/etc-pihole:/etc/pihole
    networks: [lan_net]

  # Reverse Proxy & Webserver fuer ALLE Websites (statisch + dynamisch).
  # cloudflared schickt jeden Hostnamen an caddy:80; Caddy verteilt anhand der
  # Subdomain (Routing in config/caddy/Caddyfile). Ersetzt den frueheren
  # nginx-"web"-Dienst.
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      # Wird im Caddyfile als {$DOMAIN} eingesetzt (Textersetzung beim Einlesen).
      DOMAIN: ${DOMAIN}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/srv:ro                 # statische Seiten (read-only)
      - ./data/caddy/data:/data         # Caddy-Laufzeitdaten
      - ./data/caddy/config:/config
    networks: [edge]
    # KEIN ports: (Constraint M8) - nur ueber cloudflared erreichbar

  # Beispiel fuer eine DYNAMISCHE App (eigener Container, eigenes Git-Repo).
  # Winzige Node-App ohne Abhaengigkeiten - spaeter durch die echte App ersetzen.
  # Caddy leitet app.${DOMAIN} hierher weiter (siehe Caddyfile).
  app-example:
    build: ./apps/app-example
    restart: unless-stopped
    networks: [edge]
    # KEIN ports: - nur intern ueber caddy erreichbar

  # Wine Caching - dynamische App (eigenes Repo, hineingeklont nach apps/winecashing/).
  # Caddy leitet winecashing.${DOMAIN} hierher (siehe Caddyfile). Persistenz unter
  # data/winecashing/ -> wandert automatisch ins naechtliche Backup.
  winecashing:
    build: ./apps/winecashing
    restart: unless-stopped
    environment:
      PORT: "3000"
      DB_PATH: /data/winecashing.db
    env_file: ./apps/winecashing/.env    # Secrets (SESSION_SECRET, ADMIN_*), liegt nur auf dem Pi
    volumes:
      - ./data/winecashing:/data
    networks: [edge]
    # KEIN ports: - nur intern ueber caddy erreichbar

  # GinPerium - dynamische App (eigenes Repo, hineingeklont nach apps/ginperium/).
  # Caddy leitet ginperium.${DOMAIN} hierher (siehe Caddyfile). Node + SQLite.
  # Hat jetzt (wie winecashing) einen Admin-Login -> braucht SESSION_SECRET/
  # ADMIN_* aus der .env, die scripts/deploy.sh schreibt. Persistenz unter
  # data/ginperium/ -> wandert automatisch ins naechtliche Backup.
  ginperium:
    build: ./apps/ginperium
    restart: unless-stopped
    environment:
      PORT: "3000"
      DB_PATH: /data/ginperium.db
    env_file: ./apps/ginperium/.env    # Secrets (SESSION_SECRET, ADMIN_*), liegt nur auf dem Pi
    volumes:
      - ./data/ginperium:/data
    networks: [edge]
    # KEIN ports: - nur intern ueber caddy erreichbar

  # Tipsy Trails - dynamische App (eigenes Repo, hineingeklont nach apps/tipsy-trails/).
  # Caddy leitet tipsytrails.${DOMAIN} hierher (siehe Caddyfile). Node + Fastify + SQLite.
  # Hat (wie winecashing/ginperium) einen Admin-Login -> braucht SESSION_SECRET/
  # ADMIN_* aus der .env, die scripts/deploy.sh schreibt. Persistenz unter
  # data/tipsy-trails/ -> wandert automatisch ins naechtliche Backup.
  tipsy-trails:
    build: ./apps/tipsy-trails
    restart: unless-stopped
    environment:
      PORT: "3000"
      DB_PATH: /data/db/tipsy.db
      PUBLIC_ORIGIN: https://tipsytrails.${DOMAIN}
    env_file: ./apps/tipsy-trails/.env    # Secrets (SESSION_SECRET, ADMIN_*), liegt nur auf dem Pi
    volumes:
      - ./data/tipsy-trails:/data
    networks: [edge]
    # KEIN ports: - nur intern ueber caddy erreichbar

  # Bring2Bring! - dynamische App (eigenes Repo, hineingeklont nach apps/bring2bring/).
  # Caddy leitet dishlist.${DOMAIN} hierher (siehe Caddyfile). Node + SQLite,
  # privates digitales Kochbuch. Hat (wie winecashing/ginperium/tipsy-trails)
  # einen Admin-Login -> braucht SESSION_SECRET/ADMIN_* aus der .env, die
  # scripts/deploy.sh schreibt. Persistenz unter data/bring2bring/ -> wandert
  # automatisch ins naechtliche Backup.
  #
  # Haertung nach Bring2Bring!-eigener SPEC Abschnitt 11 (bei den Geschwister-Apps
  # bisher nicht angewendet - hier bewusst nur fuer diesen Dienst):
  # read-only Root-Dateisystem, /tmp als tmpfs, keine zusaetzlichen Privilegien.
  bring2bring:
    build: ./apps/bring2bring
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    environment:
      PORT: "3000"
      DB_PATH: /data/bring2bring.db
      UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: https://dishlist.${DOMAIN}
      # npm run seed:admin laeuft (siehe deploy.sh) INNERHALB des Containers;
      # bei read_only: true braucht npm dafuer einen beschreibbaren Cache
      # ausserhalb des read-only Root-Dateisystems.
      NPM_CONFIG_CACHE: /tmp/.npm
    # env_file OPTIONAL (Long-Form, Compose >= 2.24) statt wie bei den
    # Geschwister-Apps zwingend: diese Datei entsteht erst, nachdem
    # scripts/deploy.sh apps/bring2bring/ geklont hat. Waere sie zwingend, wuerde
    # ein fehlender/fehlgeschlagener Bring2Bring!-Klon das GESAMTE
    # docker-compose.yml ungueltig machen - dann wuerde nicht einmal Pi-hole
    # starten und das ganze LAN haette kein DNS mehr.
    env_file:
      - path: ./apps/bring2bring/.env
        required: false
    volumes:
      - ./data/bring2bring:/data
    networks: [edge]
    # KEIN ports: - nur intern ueber caddy erreichbar

  cloudflared:
    image: cloudflare/cloudflared:2026.7.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [caddy]
    networks: [edge]

  uptime-kuma:
    image: louislam/uptime-kuma:2.4.0
    restart: unless-stopped
    ports:
      - "${PI_STATIC_IP}:${PORT_UPTIME}:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    networks: [lan_net]

networks:
  edge:
  lan_net:
