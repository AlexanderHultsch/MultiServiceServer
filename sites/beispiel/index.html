<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example Subpage</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #e8ecf7;
      text-align: center;
    }
    main { padding: 2rem; max-width: 40rem; }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    p { color: #9aa4c0; line-height: 1.5; }
    a { color: #6ea8fe; }
    code { background: #1a2138; padding: 0.1rem 0.3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Example Subpage</h1>
    <p>Placeholder for a static subpage, served from
       <code>sites/beispiel/</code>. This is how you add your own page -
       see README, "Hosting more websites" section.</p>
    <p><a href="/">&larr; back to home page</a></p>
  </main>
</body>
</html>
