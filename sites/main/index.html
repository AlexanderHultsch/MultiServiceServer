<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1020;
      --card: #141b30;
      --text: #e8ecf7;
      --muted: #9aa4c0;
      --accent: #6ea8fe;
      --border: #222c47;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6fb; --card: #ffffff; --text: #10182b;
        --muted: #5b6478; --accent: #2563eb; --border: #e2e6f0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    main { width: 100%; max-width: 42rem; }
    header { text-align: center; margin-bottom: 2.5rem; }
    h1 { font-size: 2rem; margin: 0 0 0.5rem; word-break: break-word; }
    header p { color: var(--muted); margin: 0; }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 34rem) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    a.card {
      display: block;
      padding: 1.25rem 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: transform .12s ease, border-color .12s ease;
    }
    a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
    a.card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; }
    a.card span { color: var(--muted); font-size: 0.9rem; }
    footer { text-align: center; margin-top: 2.5rem; color: var(--muted); font-size: 0.85rem; }
    code { background: var(--card); padding: 0.1rem 0.35rem; border-radius: 5px; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <main>
    <header>
      <!-- The domain name is filled in below via script from the current
           address, so this page works on ANY domain without changes. -->
      <h1 id="titel">Home</h1>
      <p>Self-hosted on a Raspberry Pi behind Cloudflare.</p>
    </header>

    <!-- Example tiles. New site = copy a tile and adjust data-sub.
         The links are assembled by the script into <sub>.<deine-domain>.
         They only become reachable once the matching Public Hostname ->
         http://caddy:80 has been created in the Cloudflare dashboard (see README). -->
    <div class="grid">
      <a class="card" data-sub="beispiel" href="#">
        <h2>Example subpage &rarr;</h2>
        <span>Static site (<code>sites/beispiel/</code>)</span>
      </a>
      <a class="card" data-sub="app" href="#">
        <h2>Example app &rarr;</h2>
        <span>Dynamic app (<code>apps/app-example/</code>)</span>
      </a>
    </div>

    <footer>
      This page lives at <code>sites/main/index.html</code> - replace it with your own content.
    </footer>
  </main>

  <script>
    // Determine the current domain (without a leading "www.") and fill in the title + links.
    var apex = (location.hostname || "deine-domain.de").replace(/^www\./, "");
    document.getElementById("titel").textContent = apex;
    document.querySelectorAll("a[data-sub]").forEach(function (a) {
      a.href = "https://" + a.dataset.sub + "." + apex;
    });
  </script>
</body>
</html>
