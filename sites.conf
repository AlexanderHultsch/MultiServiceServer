# Manifest of all websites that should run on this Pi.
# Read by scripts/deploy.sh. Maintain ONLY on the env branch
# (references private repos - does not belong on the generic main branch).
#
# Format per line (separated by whitespace):
#   name   repo_url   host   admin   rotate
#     name    = folder name under apps/ AND service name in docker-compose.yml
#     repo_url= git URL of the website (cloned/pulled to apps/<name>/)
#     host    = subdomain label (e.g. "winecashing" -> winecashing.<DOMAIN>),
#               or "apex" for the main domain itself
#     admin   = yes|no  (yes = needs the shared admin account + seed:admin)
#     rotate  = argument for seed:admin to rotate an existing admin password;
#               only used with deploy.sh --set-password. "-" means: the site has
#               no such argument.
#
# Lines starting with # are commented out and ignored.
# IMPORTANT: adding a line here alone is NOT enough - the service must also be
# in docker-compose.yml and config/caddy/Caddyfile (see README).

# name          repo_url                                                host          admin   rotate
winecashing     https://github.com/AlexanderHultsch/WineCashing.git     winecashing   yes     -
ginperium       https://github.com/AlexanderHultsch/GinPerium.git       ginperium     yes     -
tipsy-trails    https://github.com/AlexanderHultsch/TipsyTrails.git     tipsytrails   yes     --rotate-password
bring2bring     https://github.com/AlexanderHultsch/Bring2Bring.git     bring2bring   yes     -

# --- Still to be wired up (please check values, then uncomment): ---
# projectindex  https://github.com/AlexanderHultsch/ProjectIndex.git    apex          no
# smarttank     https://github.com/AlexanderHultsch/SmartTank.git       smarttank     no
# airquality    https://github.com/AlexanderHultsch/AirQuality.git      airquality    no
