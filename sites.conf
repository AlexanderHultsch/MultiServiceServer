# Manifest of all websites that should run on this Pi.
# Read by scripts/deploy.sh.
#
# Format per line (separated by whitespace):
#   name   repo_url   host   admin
#     name    = folder name under apps/ AND service name in docker-compose.yml
#     repo_url= git URL of the website (cloned/pulled to apps/<name>/)
#     host    = subdomain label (e.g. "shop" -> shop.<DOMAIN>),
#               or "apex" for the main domain itself
#     admin   = yes|no  (yes = needs the shared admin account + seed:admin)
#
# Lines starting with # are commented out and ignored.
# IMPORTANT: adding a line here alone is NOT enough - the service must also be
# in docker-compose.yml and config/caddy/Caddyfile (see README,
# section "Managing Multiple Sites Centrally").

# Example (commented out - replace with your own sites):
# shop          https://github.com/<you>/my-shop-app.git     shop          yes
# blog          https://github.com/<you>/my-blog.git         blog          no
